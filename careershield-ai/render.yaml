services:
  - type: web
    name: careershield-api
    env: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: PORT
        value: 8787

  - type: web
    name: careershield-ui
    runtime: static
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
