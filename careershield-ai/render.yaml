services:
  - type: web
    name: careershield-api
    env: node
    rootDir: ./
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: PORT
        value: 8787

  - type: static
    name: careershield-ui
    env: static
    rootDir: ./
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
